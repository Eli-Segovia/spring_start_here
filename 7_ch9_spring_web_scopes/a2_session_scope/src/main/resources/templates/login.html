<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>

    <form action="/" method="post">
        Username: <input type="text" name="username" id="username"/> <br/>
        Password: <input type="text" name="password" id="password"/> <br/>
        <button type="submit">Log In</button>
    </form>


    <p th:text="${message}"></p>

</body>
</html>
